name: Deploy to CDN

on:
  workflow_run:
    workflows: ["Run Cucumber Tests"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Source Repo (avrint/lean-state)
        uses: actions/checkout@v7

      - name: Generate Token for target repo
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: 'avrint'
          repositories: 'cdn'

      - name: Checkout Target Repo (avrint/cdn)
        uses: actions/checkout@v4
        with:
          repository: 'avrint/cdn'
          token: ${{ steps.generate_token.outputs.token }}
          path: 'cdn'
          

      - name: Copy File and Push Changes
        run: |
          # 1. Ensure target directory exists and copy file
          mkdir -p cdn/packages/lean-state
          cp ./src/lean-state.js ./cdn/packages/lean-state/lean-state.js

          # 2. Change directory, commit, and push
          cd cdn
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/lean-state/lean-state.js
          
          # Only commit and push if changes exist
          if git diff --staged --quiet; then
            echo "No changes detected in lean-state.js."
          else
            git commit -m "chore: sync lean-state.js from avrint/lean-state"
            git push origin main
          fi