name: Run Cucumber Tests

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm tst

      - name: Rename JSON report to cucumber-report.json
        if: ${{ !cancelled() }}
        run: |
          file=$(find .tmp/json -maxdepth 1 -name "*.json" | head -n 1)
          if [ -n "$file" ]; then
            mv "$file" .tmp/json/cucumber-report.json
          fi

      - name: Test Report
        if: ${{ !cancelled() }}
        run: node .github/workflows/scripts/cucumber-to-summary.js .tmp/json/cucumber-report.json >> $GITHUB_STEP_SUMMARY 
