name: Run Cucumber Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache node modules
        uses: actions/cache@v6
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install

  test:
    needs: prep
    runs-on: ubuntu-latest
    outputs:
      cucumber_json: ${{ steps.export_json.outputs.report_data }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Restore node modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Run Tests
        run: npm tst

      - name: Export JSON to Output
        id: export_json
        if: always()
        run: |
          file=$(find .tmp/json -maxdepth 1 -name "*.json" | head -n 1)
          if [ -n "$file" ]; then
            # Use a secure delimiter for multiline GitHub Action outputs
            EOF="CUCUMBER_REPORT_EOF"
            echo "report_data<<$EOF" >> "$GITHUB_OUTPUT"
            cat "$file" >> "$GITHUB_OUTPUT"
            echo "$EOF" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: test
    if: always() && needs.test.outputs.cucumber_json != ''
    runs-on: ubuntu-latest
    steps:
      # No checkout or node setup needed here at all!
      - name: Reconstruct JSON Report
        env:
          REPORT_DATA: ${{ needs.test.outputs.cucumber_json }}
        run: |
          mkdir -p .tmp/json
          echo "$REPORT_DATA" > .tmp/json/cucumber-report.json

      - name: Cucumber GitHub Summary 
        uses: avrint/cucumber-summary@main
        with:
          report_path: .tmp/json/