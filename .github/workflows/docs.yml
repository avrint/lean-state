name: Generate API Docs

on:
  push:
    branches:
      - main
    paths:
      - 'src/lean-state.js' # Only runs when your source file changes

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate and Inject Documentation
        run: |
          node -e '
            const fs = require("fs");
            const jsdoc2md = require("jsdoc-to-markdown");

            async function run() {
              try {
                // Pass files array correctly to the async render method
                const api = await jsdoc2md.render({ files: "./src/lean-state.js" });
                let readme = fs.readFileSync("README.md", "utf8");
                
                const start = "<!-- START API -->";
                const end = "<!-- END API -->";
                const startIndex = readme.indexOf(start);
                const endIndex = readme.indexOf(end);

                if (startIndex !== -1 && endIndex !== -1) {
                  const insertionPoint = startIndex + start.length;
                  readme = readme.substring(0, insertionPoint) + "\n\n" + api + "\n" + readme.substring(endIndex);
                  fs.writeFileSync("README.md", readme, "utf8");
                  console.log("README successfully updated with API docs.");
                } else {
                  console.error("Comment markers not found in README.md");
                  process.exit(1);
                }
              } catch (err) {
                console.error("Failed to generate documentation:", err);
                process.exit(1);
              }
            }

            run();
          '

      - name: Commit and Push Changes
        uses: devops-infra/action-commit-push@v1.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "docs: automatic API documentation update"
          branch: main